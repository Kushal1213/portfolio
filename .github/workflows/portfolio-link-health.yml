name: Portfolio link health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-links.mjs
